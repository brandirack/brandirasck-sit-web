<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BRANDIRASCK — Digital Growth Partner</title>
<meta name="description" content="BRANDIRASCK — وكالة مغربية متخصصة في الديجيتال، شريكك للوصول إلى سقف طموحاتك.">
<style>
:root{
  --bg:#070707; --panel:#0e0e0e; --panel2:#121212; --gold:#e7b84f;
  --gold2:#f5d27b; --text:#f7f5ef; --muted:#aaa7a0; --line:rgba(255,106,0,.28);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(circle at 15% 15%,#0a1018 0,transparent 32%),var(--bg);color:var(--text);font-family:Arial,"Noto Sans Arabic",sans-serif}
a{text-decoration:none;color:inherit}
.container{width:min(1180px,92%);margin:auto}
nav{height:78px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(7,7,7,.88);backdrop-filter:blur(14px);z-index:10}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.5px}
.logo-mark{width:42px;height:42px;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;color:var(--gold);font-size:23px}
.logo small{display:block;color:#888;font-size:8px;letter-spacing:2px;margin-top:3px}
.navlinks{display:flex;gap:28px;color:#c8c5bf;font-size:14px}
.navlinks a:hover{color:var(--gold)}
.btn{border:1px solid var(--gold);padding:12px 20px;border-radius:14px;background:linear-gradient(135deg,#ff8a1f,#ff4d00);color:#15110a;font-weight:800;cursor:pointer;display:inline-block}
.btn.secondary{background:transparent;color:var(--gold2)}
.hero{min-height:680px;display:grid;grid-template-columns:1.05fr .95fr;gap:45px;align-items:center;padding:70px 0 50px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:30px;padding:9px 16px;color:#f2f5f8;background:#090b10}
h1{font-size:clamp(42px,6vw,76px);line-height:1.08;margin:22px 0}
h1 span{color:var(--gold)}
.lead{font-size:20px;line-height:1.9;color:#c7c3bb;max-width:650px}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:22px;margin-top:35px;overflow:hidden;background:#090b10}
.metric{padding:20px 12px;text-align:center;border-left:1px solid rgba(255,255,255,.08)}
.metric:last-child{border-left:0}
.metric b{display:block;color:var(--gold);font-size:24px}.metric small{color:#aaa}
.visual{position:relative;min-height:470px;display:grid;place-items:center}
.phone{width:260px;height:500px;border:7px solid #202020;border-radius:38px;background:linear-gradient(160deg,#171717,#090909);box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(21,151,255,.12);transform:rotate(-8deg);padding:22px}
.screen{height:100%;border-radius:25px;background:linear-gradient(180deg,#111,#080808);padding:24px 16px}
.chart{height:150px;border-bottom:1px solid #333;position:relative;margin-top:20px}
.chart svg{width:100%;height:100%}
.float{position:absolute;padding:12px 15px;border:1px solid var(--line);border-radius:14px;background:#0d0d0d;box-shadow:0 10px 30px #000;color:#fff}
.f1{top:70px;left:0}.f2{top:175px;right:0}.f3{bottom:80px;left:15px}.f4{bottom:30px;right:5px}
section{padding:90px 0;border-top:1px solid rgba(255,255,255,.06)}
.section-title{text-align:center;font-size:38px;margin:0 0 12px}.section-sub{text-align:center;color:var(--muted);margin:0 auto 42px;line-height:1.8}
.industries{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{min-height:155px;border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;justify-content:end;background:linear-gradient(145deg,#151515,#0a0a0a);transition:.25s;cursor:pointer}
.card:hover{transform:translateY(-5px);border-color:var(--gold);box-shadow:0 15px 40px rgba(231,184,79,.1)}
.card .icon{font-size:30px;color:var(--gold);margin-bottom:auto}.card h3{margin:0 0 7px}.card p{margin:0;color:#999;font-size:13px}
.trust{display:flex;gap:25px;justify-content:center;flex-wrap:wrap;color:#777;font-weight:800;font-size:20px;letter-spacing:2px}
.cta{text-align:center;border:1px solid var(--line);border-radius:28px;padding:65px 25px;background:radial-gradient(circle at center,#0a1018,#090b10 55%)}
.promo-bar{position:relative;z-index:9;border-bottom:1px solid rgba(255,106,0,.35);background:linear-gradient(90deg,#120b06,#0b1118,#120b06);padding:10px 0}.promo-inner{width:min(1180px,92%);margin:auto;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center}.promo-msg{font-weight:800;color:#fff}.promo-msg b{color:var(--gold)}.promo-timer{display:inline-flex;gap:7px;align-items:center;color:#fff}.promo-timer span{border:1px solid rgba(231,184,79,.35);background:#090b10;border-radius:9px;padding:5px 8px;min-width:42px}.promo-timer small{color:#999}.promo-link{color:var(--gold2);font-weight:800;cursor:pointer}.promo-free{margin-top:12px;padding:12px 15px;border:1px solid rgba(21,151,255,.3);border-radius:14px;background:#0b1118;color:#dfe8f3}.promo-free strong{color:#1597ff}.countdown-box{display:flex;justify-content:center;gap:10px;margin:16px 0;direction:ltr}.countdown-box .unit{min-width:65px;padding:9px;border:1px solid rgba(231,184,79,.3);border-radius:12px;background:#090b10}.countdown-box b{display:block;color:var(--gold);font-size:22px}.countdown-box small{color:#888}.new-client-check{display:flex!important;flex-direction:row!important;align-items:center;justify-content:space-between;border:1px solid #303640;padding:13px;border-radius:12px;background:#10141a}.new-client-check input{width:20px!important;height:20px}
.account-modal{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.88);backdrop-filter:blur(10px);display:none;padding:20px;overflow:auto}.account-modal.open{display:grid;place-items:center}.account-box{width:min(1100px,100%);max-height:94vh;overflow:auto;background:#0b0d12;border:1px solid rgba(21,151,255,.28);border-radius:24px;box-shadow:0 30px 100px #000}.account-head{padding:22px 26px;border-bottom:1px solid #242a32;display:flex;justify-content:space-between;align-items:center}.account-head button{width:40px;height:40px;border-radius:50%;background:#111;color:#fff;border:1px solid #333;font-size:24px;cursor:pointer}.account-body{padding:25px}.account-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.account-card{border:1px solid #252b34;border-radius:18px;padding:18px;background:#0f1217}.account-card h3{margin-top:0}.status{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;font-weight:800;font-size:12px}.status.ok{background:rgba(38,190,110,.12);color:#42d487;border:1px solid rgba(38,190,110,.35)}.status.bad{background:rgba(255,70,70,.10);color:#ff7777;border:1px solid rgba(255,70,70,.35)}.account-services{display:grid;gap:9px}.account-service{display:flex;justify-content:space-between;gap:15px;padding:12px;border-radius:12px;background:#11151b;border:1px solid #252b34}.account-service b{color:#fff}.account-service span{color:#a9b0ba}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.day{min-height:72px;border:1px solid #252b34;border-radius:10px;padding:8px;background:#10141a;cursor:pointer}.day small{color:#777}.day strong{display:block;margin-top:6px}.day.photo{border-color:rgba(255,106,0,.45)}.day.ads{border-color:rgba(21,151,255,.35)}.day.off{opacity:.35;cursor:not-allowed}.day.full{border-color:#ff4d4d;opacity:.55;cursor:not-allowed}.day.selected{outline:2px solid var(--gold);background:#17120c}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.notice-list{display:grid;gap:8px}.notice{padding:12px;border-radius:12px;background:#11151b;border-right:3px solid var(--gold)}.login-tabs{display:flex;gap:8px;margin-bottom:18px}.login-tabs button{border:1px solid #303640;background:#10141a;color:#fff;padding:10px 14px;border-radius:10px;cursor:pointer}.login-tabs button.active{border-color:var(--gold);color:var(--gold2)}
footer{padding:35px 0;color:#777;text-align:center;border-top:1px solid var(--line)}
@media(max-width:900px){
 .navlinks{display:none}.hero{grid-template-columns:1fr;text-align:center}.lead{margin:auto}.visual{order:-1}.metrics{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2n){border-left:0}.industries{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
 .hero{padding-top:35px}.phone{width:210px;height:410px}.visual{min-height:440px}.float{font-size:12px}.industries{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}h1{font-size:42px}.navlinks{display:none}
}

.brand-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 22px rgba(21,151,255,.18)}
.logo{color:#fff}
.logo small{color:#8d96a3}
h1 span{background:linear-gradient(90deg,#ff6a00,#ff9a3d 45%,#1597ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card:hover{box-shadow:0 15px 40px rgba(255,106,0,.10)}
.cta{background:radial-gradient(circle at 35% 45%,#14100b,#090b10 58%)}


.config-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);backdrop-filter:blur(10px);z-index:50;display:none;padding:20px;overflow:auto}
.config-overlay.open{display:grid;place-items:center}
.config-modal{width:min(980px,100%);max-height:92vh;overflow:auto;background:#0b0d12;border:1px solid rgba(255,106,0,.35);border-radius:26px;box-shadow:0 30px 100px #000}
.config-head{padding:24px 28px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center}
.config-head h2{margin:5px 0 0;font-size:30px}.config-kicker{font-size:11px;letter-spacing:3px;color:#1597ff}
.config-actions{display:flex;gap:16px;align-items:center;color:#999}.config-actions button{width:38px;height:38px;border-radius:50%;border:1px solid #333;background:#111;color:#fff;font-size:24px;cursor:pointer}
.config-body{padding:28px}.selected-industry{padding:14px 16px;border:1px solid rgba(21,151,255,.25);border-radius:14px;margin-bottom:22px;background:#0d131b;color:#b9c2ce}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.form-grid label{display:flex;flex-direction:column;gap:8px;color:#bbb;font-size:13px}
.form-grid input,.service-item select{width:100%;background:#11151b;color:#fff;border:1px solid #303640;border-radius:12px;padding:13px;outline:none}
.form-grid input:focus,.service-item select:focus{border-color:#1597ff}
.service-list{display:grid;gap:13px}.service-item{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:center;padding:18px;border:1px solid #252a32;border-radius:17px;background:#0f1217}
.service-item h3{margin:0 0 6px}.service-item p{margin:0;color:#8e959e;font-size:13px;line-height:1.6}
.config-note{color:#8f959e;line-height:1.7;font-size:13px;margin:0 0 18px}
.config-foot{padding:18px 28px;border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:space-between;align-items:center;position:sticky;bottom:0;background:#0b0d12}
.config-foot strong{display:block;color:#ff8a1f;font-size:23px}.config-foot span{color:#888;font-size:11px}.config-foot>div:last-child{display:flex;gap:10px}
.review-box{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #242a32;color:#aaa}.review-box b{color:#fff}.review h3{margin-top:28px}
.review ul{list-style:none;padding:0;margin:12px 0 20px;display:grid;gap:8px}.review li{display:flex;justify-content:space-between;padding:13px;border-radius:10px;background:#10141a}.review li span{color:#aeb5bf}.review-total{display:flex;justify-content:space-between;align-items:center;padding:20px;border:1px solid rgba(255,106,0,.28);border-radius:15px;background:#14100b}.review-total strong{color:#ff8a1f;font-size:26px}
@media(max-width:650px){.form-grid{grid-template-columns:1fr}.service-item{grid-template-columns:1fr}.config-head{padding:20px}.config-body{padding:20px}.config-foot{padding:15px 20px}.config-foot>div:first-child{display:none}.config-foot>div:last-child{width:100%}.config-foot button{flex:1}}


.send-success{text-align:center;max-width:760px;margin:0 auto;padding:18px 8px 8px}.send-icon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;border:1px solid var(--gold);color:var(--gold);font-size:34px}.send-success h3{font-size:24px;margin:8px 0 10px}.send-success p{color:#aaa;line-height:1.8}.send-primary{margin:22px 0}.send-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}.send-grid .btn{width:100%;text-align:center}.send-contact{margin:18px auto;padding:15px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#0b0d11;color:#ddd;line-height:2}.send-success textarea{width:100%;min-height:150px;background:#08090c;color:#ddd;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:12px;direction:auto;resize:vertical}@media(max-width:650px){.send-grid{grid-template-columns:1fr}}
</style>

<style>
.industry-search input,.other-box input{width:100%;padding:14px;border-radius:12px;background:#11151b;border:1px solid #303640;color:#fff;outline:none}
.industry-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:16px 0}
.industry-btn{padding:13px 9px;border:1px solid #2b3139;border-radius:12px;background:#10141a;color:#ddd;cursor:pointer}
.industry-btn.active,.industry-btn:hover{border-color:#1597ff;background:#101b26}
.other-box{padding:17px;border:1px dashed #39404b;border-radius:14px;color:#aaa}
.other-box label{display:grid;gap:8px;font-size:13px}

.services-tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}
.services-tabs button{white-space:nowrap;padding:11px 14px;border:1px solid #2b3139;border-radius:11px;background:#10141a;color:#ddd;cursor:pointer}
.services-tabs button.active{border-color:#1597ff;background:#101b26}
.service-card{border:1px solid #272d36;background:#0f1217;border-radius:17px;padding:18px;margin-bottom:13px}
.service-top{display:flex;justify-content:space-between;gap:15px}
.service-top h3{margin:0 0 6px}.service-top p{margin:0;color:#8e959e;font-size:13px;line-height:1.65}
.option-list,.choice-grid{display:grid;gap:9px;margin-top:16px}.goal-option{padding:13px;border:1px solid #2b3139;background:#11151b;color:#ddd;border-radius:11px;cursor:pointer;text-align:right}.goal-option.picked{border-color:#ff6a00;background:#17120d}.goal-option>span{display:block;font-weight:700}.goal-option>small{display:block;color:#7f8791;line-height:1.5;margin-top:5px}
.option-list button,.choice-grid button{padding:13px;border:1px solid #2b3139;background:#11151b;color:#ddd;border-radius:11px;cursor:pointer;text-align:right}
.option-list button{display:grid;grid-template-columns:1fr auto;gap:5px}
.option-list button small{grid-column:1/-1;color:#7f8791;line-height:1.5}
.option-list button.picked,.choice-grid button.picked{border-color:#ff6a00;background:#17120d}
.option-list b,.choice-grid b{color:#ff9a3d}
.qty-row,.stars-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.qty-row button,.stars-row button{border:1px solid #303640;background:#11151b;color:#ddd;border-radius:10px;padding:11px 14px;cursor:pointer}
.qty-row button.picked,.stars-row button.picked{border-color:#ff6a00;color:#ff9a3d}
.stars-row small{display:block;color:#7e8791;margin-top:4px}
.target-row{display:flex;gap:9px;align-items:center;margin-top:15px}

.price-detail{margin-top:13px;padding:11px;border-radius:10px;background:#0a0d12;color:#aeb5bf;font-size:13px}
.config-note{color:#8f959e;line-height:1.7;font-size:13px}
.empty-state{text-align:center;padding:45px;border:1px dashed #303640;border-radius:15px;color:#888}
@media(max-width:760px){.industry-grid{grid-template-columns:repeat(2,1fr)}.service-top{display:block}.target-row{display:grid}.target-row input{max-width:none}}
</style>

<div class="cta">
  <div class="container">
    <h2>واجد تبدأ حثى أنت؟</h2>
    <p>أجي نكتشفو مع بعضياتنا الخدمة المناسبة ليك، والنتيجة لي تقدر توصل ليها.</p>
    <button class="btn" onclick="openModal('CONFIG')">احسب الميزانية والنتائج</button>
  </div>
</div>

<div class="config-overlay" id="CONFIG-OVERLAY">
  <div class="config-modal">
    <div class="config-head">
      <div>
        <div class="config-kicker">BRANDIRASCK CONFIGURATOR</div>
        <h2>حاسبة الميزانية والنتائج متقدمة</h2>
      </div>
      <div class="config-actions">
        <button onclick="closeModal('CONFIG')">×</button>
      </div>
    </div>
    <div class="config-body" id="CONFIG-BODY"></div>
    <div class="config-foot" id="CONFIG-FOOT"></div>
  </div>
</div>

<footer>
  <div class="container">
    <p>© 2026 BRANDIRASCK. جميع الحقوق محفوظة.</p>
  </div>
</footer>

<script>
let currentStep = 1;
let selectedIndustry = '';
let configData = {
  goals: [],
  services: {},
  clientInfo: { name: '', phone: '', email: '', isNewClient: true }
};

const industries = ['التجارة الإلكترونية', 'العقارات', 'الخدمات', 'مطاعم ومقاهي', 'التعليم والتدريب', 'الصحة والجمال', 'أخرى'];

const serviceOptions = [
  { id: 'ads', name: 'إعلانات ممولة (Paid Ads)', desc: 'حملات إعلانية على فايسبوك، إنستغرام، وتيك توك لتكبير المبيعات.', price: 1500 },
  { id: 'content', name: 'صناعة المحتوى وGérer الصفحة', desc: 'تصميم الصور، الفيديوهات (Reels)، وإدارة الحسابات بشكل احترافي.', price: 2000 },
  { id: 'web', name: 'إنشاء موقع / متجر إلكتروني', desc: 'موقع احترافي وسريع متوافق مع جميع الهواتف للحصول على مبيعات أكثر.', price: 3000 }
];

function openModal(id) {
  document.getElementById(id + '-OVERLAY').classList.add('open');
  if(id === 'CONFIG') renderStep();
}

function closeModal(id) {
  document.getElementById(id + '-OVERLAY').classList.remove('open');
}

function renderStep() {
  const body = document.getElementById('CONFIG-BODY');
  const foot = document.getElementById('CONFIG-FOOT');

  if(currentStep === 1) {
    body.innerHTML = `
      <h3>اختر مجالك التجاري</h3>
      <div class="industry-grid">
        ${industries.map(ind => `
          <button class="industry-btn ${selectedIndustry === ind ? 'active' : ''}" onclick="selectIndustry('${ind}')">${ind}</button>
        `).join('')}
      </div>
    `;
    foot.innerHTML = `
      <div><span>الخطوة 1 من 4</span></div>
      <div>
        <button class="btn" ${!selectedIndustry ? 'disabled style="opacity:0.5;cursor:not-allowed;"' : ''} onclick="nextStep()">التالي</button>
      </div>
    `;
  } else if(currentStep === 2) {
    body.innerHTML = `
      <div class="selected-industry">المجال المحدد: <b>${selectedIndustry}</b></div>
      <h3>اختر الخدمات المطلوبة</h3>
      <div class="service-list">
        ${serviceOptions.map(srv => `
          <div class="service-item">
            <div>
              <h3>${srv.name}</h3>
              <p>${srv.desc}</p>
            </div>
            <div>
              <label>
                <input type="checkbox" ${configData.services[srv.id] ? 'checked' : ''} onchange="toggleService('${srv.id}', this.checked)">
                اختيار الخدمة (${srv.price} درهم)
              </label>
            </div>
          </div>
        `).join('')}
      </div>
    `;
    foot.innerHTML = `
      <div><span>الخطوة 2 من 4</span></div>
      <div>
        <button class="btn secondary" onclick="prevStep()">السابق</button>
        <button class="btn" onclick="nextStep()">التالي</button>
      </div>
    `;
  } else if(currentStep === 3) {
    body.innerHTML = `
      <h3>معلومات التواصل</h3>
      <div class="form-grid">
        <label>
          الاسم الكامل
          <input type="text" id="clientName" value="${configData.clientInfo.name}" oninput="configData.clientInfo.name = this.value">
        </label>
        <label>
          رقم الهاتف (واتساب مغربي صحيح)
          <input type="tel" id="clientPhone" placeholder="06XXXXXXXX / 07XXXXXXXX / 05XXXXXXXX" value="${configData.clientInfo.phone}" oninput="configData.clientInfo.phone = this.value">
        </label>
        <label style="grid-column: 1 / -1;">
          البريد الإلكتروني (Gmail)
          <input type="email" id="clientEmail" placeholder="example@gmail.com" value="${configData.clientInfo.email}" oninput="configData.clientInfo.email = this.value">
        </label>
      </div>
    `;
    foot.innerHTML = `
      <div><span>الخطوة 3 من 4</span></div>
      <div>
        <button class="btn secondary" onclick="prevStep()">السابق</button>
        <button class="btn" onclick="validateAndNext()">التالي</button>
      </div>
    `;
  } else if(currentStep === 4) {
    let total = calculateTotal();
    body.innerHTML = `
      <h3>مراجعة الطلب والتأكيد</h3>
      <div class="review">
        <div class="review-box"><span>المجال:</span> <b>${selectedIndustry}</b></div>
        <div class="review-box"><span>الاسم:</span> <b>${configData.clientInfo.name}</b></div>
        <div class="review-box"><span>الهاتف:</span> <b>${configData.clientInfo.phone}</b></div>
        <div class="review-box"><span>البريد الإلكتروني:</span> <b>${configData.clientInfo.email}</b></div>
        <h3>الخدمات المختارة:</h3>
        <ul>
          ${Object.keys(configData.services).filter(key => configData.services[key]).map(key => {
            let srv = serviceOptions.find(s => s.id === key);
            return `<li><span>${srv.name}</span> <b>${srv.price} درهم</b></li>`;
          }).join('')}
        </ul>
        <div class="review-total">
          <span>المجموع التقديري:</span>
          <strong>${total} درهم</strong>
        </div>
      </div>
    `;
    foot.innerHTML = `
      <div><span>الخطوة النهائية</span></div>
      <div>
        <button class="btn secondary" onclick="prevStep()">السابق</button>
        <button class="btn" onclick="submitOrder()">تأكيد وإرسال الطلب</button>
      </div>
    `;
  }
}

function selectIndustry(ind) {
  selectedIndustry = ind;
  renderStep();
}

function toggleService(id, checked) {
  configData.services[id] = checked;
}

function nextStep() {
  currentStep++;
  renderStep();
}

function prevStep() {
  currentStep--;
  renderStep();
}

function validateAndNext() {
  const name = document.getElementById('clientName').value.trim();
  const phone = document.getElementById('clientPhone').value.trim();
  const email = document.getElementById('clientEmail').value.trim();

  if(!name) {
    alert('عفاك دخل الاسم الكامل ديالك.');
    return;
  }

  // تأكيد رقم الهاتف المغربي (يبدأ بـ 05 أو 06 أو 07 و يتكون من 10 أرقام)
  const phoneRegex = /^(05|06|07)\d{8}$/;
  if(!phoneRegex.test(phone)) {
    alert('عفاك دخل رقم هاتف مغربي صحيح (يبدأ بـ 05، 06، أو 07 وفيه 10 أرقام بالضبط).');
    return;
  }

  // تأكيد البريد الإلكتروني (ينتهي بـ @gmail.com)
  const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
  if(!gmailRegex.test(email)) {
    alert('عفاك دخل بريد إلكتروني صحيح ينتهي بـ @gmail.com');
    return;
  }

  configData.clientInfo = { name, phone, email };
  nextStep();
}

function calculateTotal() {
  let total = 0;
  for(let key in configData.services) {
    if(configData.services[key]) {
      let srv = serviceOptions.find(s => s.id === key);
      if(srv) total += srv.price;
    }
  }
  return total;
}

function submitOrder() {
  const body = document.getElementById('CONFIG-BODY');
  const foot = document.getElementById('CONFIG-FOOT');
  
  body.innerHTML = `
    <div class="send-success">
      <div class="send-icon">✓</div>
      <h3>تم استلام طلبك بنجاح!</h3>
      <p>شكراً لك <b>${configData.clientInfo.name}</b>، سيتواصل معك فريق BRANDIRASCK في أقرب وقت ممكن عبر الهاتف أو الواتساب.</p>
    </div>
  `;
  foot.innerHTML = `
    <div style="width:100%;text-align:center;">
      <button class="btn" onclick="closeModal('CONFIG'); currentStep=1;">إغلاق</button>
    </div>
  `;
}
</script>
</body>
</html>
