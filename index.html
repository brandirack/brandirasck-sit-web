<script>
async function handleUserSignup(event) {
    event.preventDefault(); // باش ما يعاودش يتشارجا الصفحة

    // جلب القيمة من المدخلات (تأكد بلي الـ IDs كيتطابقوا مع الحقول لي عندك في HTML)
    const nameInput = document.getElementById('userName');
    const emailInput = document.getElementById('userEmail');

    if (!nameInput || !emailInput) {
        alert('المرجو التأكد من حقول الإدخال في الصفحة');
        return;
    }

    const name = nameInput.value;
    const email = emailInput.value;

    try {
        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ name, email })
        });

        const data = await response.json();

        if (data.success) {
            alert('تم التسجيل بنجاح ومرحبا بك!');
            // مسح الحقول بعد التسجيل الناجح
            nameInput.value = '';
            emailInput.value = '';
        } else {
            alert('خطأ: ' + (data.error || 'حدث مشكل أثناء التسجيل'));
        }
    } catch (error) {
        console.error('Error:', error);
        alert('تعذر الاتصال بالسيرفر، تذكد من الإنترنت.');
    }
}
</script>
